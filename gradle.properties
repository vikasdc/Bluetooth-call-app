android.useAndroidX=true
android.enableJetifier=true
# Explicit tmpdir so sqlite-jdbc can extract its aarch64 native lib without hitting
# macOS SIP-restricted paths. Also raise heap for annotation processing on M-series.
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8 -Djava.io.tmpdir=/tmp
org.gradle.parallel=true
org.gradle.caching=true
kotlin.code.style=official
