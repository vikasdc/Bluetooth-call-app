android.useAndroidX=true
android.enableJetifier=true
# Apple Silicon (aarch64) fix for Room annotation processing:
#   -Dsqlite.purejava=true  → sqlite-jdbc skips native lib entirely, uses bundled pure-Java SQLite
#   -Djava.io.tmpdir=/tmp   → fallback writeable tmpdir if native extraction is attempted
# Also raise heap for annotation processing on M-series.
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8 -Djava.io.tmpdir=/tmp -Dsqlite.purejava=true
org.gradle.parallel=true
org.gradle.caching=true
kotlin.code.style=official
